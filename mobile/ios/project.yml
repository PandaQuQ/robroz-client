# XcodeGen spec for the unsigned iOS build (Slint's iOS guide: Xcode builds
# the app, a script runs cargo). `.github/workflows/mobile.yml` generates the
# project and builds it with code signing disabled.
name: robroz
options:
  bundleIdPrefix: dev.robroz
settings:
  ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  robroz:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.robroz.mobile
        PRODUCT_NAME: robroz
        CODE_SIGN_STYLE: Manual
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: robroz
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        # iOS 27 needs the UIScene lifecycle; Slint's winit backend provides
        # the scene delegate.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Slint
                UISceneDelegateClassName: SlintWindowSceneDelegate
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    sources: []
    postCompileScripts:
      - script: |
          ./build_for_ios_with_cargo.bash robroz-mobile
        name: Build Rust with cargo
        outputFileLists: $TARGET_BUILD_DIR/$EXECUTABLE_PATH
