[workspace]
members = [
    "client",
    "crates/robroz-card",
    "crates/robroz-tokens",
    "crates/robroz-ui",
    "mobile",
]
# `mobile/` (Slint, Android/iOS spike) is built by its own workflow, not by a bare `cargo build`.
default-members = [
    "client",
    "crates/robroz-card",
    "crates/robroz-tokens",
    "crates/robroz-ui",
]
resolver = "2"

[workspace.package]
license = "AGPL-3.0-only"

# The contract and the host live in https://github.com/PandaQuQ/robroz. The
# client builds against a tagged contract release; the host is only a
# dev-dependency for the `against_host` tests.
# Host stays on `contract-v0.3.0` so against_host does not pick up the
# unrelated host 0.2.0 / only_bro routing that landed on the same tag.
[workspace.dependencies]
robroz-contract = { git = "https://github.com/PandaQuQ/robroz", tag = "contract-v0.3.1" }
robroz-host = { git = "https://github.com/PandaQuQ/robroz", tag = "contract-v0.3.0" }

[profile.release]
# Drop symbols from the Linux, Windows and macOS release binaries.
strip = true
