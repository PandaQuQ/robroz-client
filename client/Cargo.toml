[package]
name = "robroz-client"
version = "0.2.0"
edition = "2021"
publish = false
license.workspace = true

[dependencies]
robroz-contract = { workspace = true }
robroz-card = { path = "../crates/robroz-card" }
robroz-ui = { path = "../crates/robroz-ui" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
iced = { version = "0.14.0", features = ["tokio", "canvas", "advanced"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
# rustls (same as the host) so a remote ROBROZ_HOST can be https://; no system TLS deps.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Decodes the embedded PNG for the window icon (iced is built without its `image` feature).
png = "0.18"
# OS keychain for the saved host token; falls back to a 0600 file if unavailable.
# macOS Keychain, Windows Credential Manager, and on Linux the Secret Service over
# pure-Rust zbus (persists across reboots; no OpenSSL, no libdbus). Without a
# Secret Service the token falls back to a 0600 file.
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }

[dev-dependencies]
# In-process host for the `against_host` tests, from the server repository.
robroz-host = { workspace = true }
# Same crate and version as the host's: `against_host` tests set a card's time
# columns in the host database the way the pump's claim does.
rusqlite = { version = "0.41", features = ["bundled"] }
axum = "0.8"
serde = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }

[build-dependencies]
# Embeds assets/brand/icon.ico into the Windows exe. build.rs only calls it when
# targeting Windows; the crate itself compiles on every host.
winresource = "0.1"
