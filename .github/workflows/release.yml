name: Release

# Builds client release binaries when a `v*` tag is pushed and attaches them,
# with SHA256 checksums, to a draft GitHub Release. The draft stays private
# until a maintainer publishes it by hand. Binaries are not code-signed.
#
# workflow_dispatch is a dry run: it builds and packages the same artifacts.
# It does not create a release.
#
# The host binary and the robroz-host / robroz-runner images are released
# from https://github.com/PandaQuQ/robroz.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned so the Linux binaries link against glibc 2.35 and run on
          # Ubuntu 22.04+ and Debian 12+. ubuntu-latest moves forward.
          - os: ubuntu-22.04
            target: linux-x86_64
            packages: "-p robroz-client"
            bins: "robroz-client"
          - os: windows-latest
            target: windows-x86_64
            packages: "-p robroz-client"
            bins: "robroz-client"
          - os: macos-latest
            target: macos-aarch64
            packages: "-p robroz-client"
            bins: "robroz-client"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binaries
        run: cargo build --release --locked ${{ matrix.packages }}
      - name: Check glibc floor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for bin in ${{ matrix.bins }}; do
            max=$(objdump -T "target/release/${bin}" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
            echo "${bin} needs glibc ${max}"
            if [ "$(printf '%s\n2.35\n' "${max}" | sort -V | tail -1)" != "2.35" ]; then
              echo "::error::${bin} needs glibc ${max}, above the 2.35 floor"
              exit 1
            fi
          done
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          # A dispatched dry run may come from a branch whose name contains slashes.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${version//\//-}"
          fi
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          mkdir -p dist
          for bin in ${{ matrix.bins }}; do
            name="${bin}-${version}-${{ matrix.target }}"
            stage="stage/${name}"
            mkdir -p "${stage}"
            cp "target/release/${bin}${ext}" "${stage}/"
            cp LICENSE README.md "${stage}/"
            if [ "${{ runner.os }}" = "macOS" ] && [ "${bin}" = "robroz-client" ]; then
              # Wrap the client in a minimal .app bundle, including the
              # Dock and Finder icon.
              app="${stage}/robroz.app/Contents"
              mkdir -p "${app}/MacOS" "${app}/Resources"
              mv "${stage}/${bin}" "${app}/MacOS/${bin}"
              cp assets/brand/icon.icns "${app}/Resources/icon.icns"
              cat > "${app}/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>robroz</string>
            <key>CFBundleDisplayName</key><string>robroz</string>
            <key>CFBundleIdentifier</key><string>io.github.pandaquq.robroz</string>
            <key>CFBundleExecutable</key><string>${bin}</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version#v}</string>
            <key>CFBundleVersion</key><string>${version#v}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
            fi
            if [ "${{ runner.os }}" = "Linux" ] && [ "${bin}" = "robroz-client" ]; then
              cp client/packaging/robroz.desktop "${stage}/"
              cp assets/brand/icon-512.png "${stage}/robroz.png"
            fi
            if [ "${{ runner.os }}" = "Windows" ]; then
              (cd stage && 7z a -tzip "../dist/${name}.zip" "${name}" > /dev/null)
            elif [ "${{ runner.os }}" = "macOS" ]; then
              (cd stage && zip -qry "../dist/${name}.zip" "${name}")
            else
              tar -C stage -czf "dist/${name}.tar.gz" "${name}"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Write release notes
        run: |
          set -euo pipefail
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "${notes}" ]; then
            cp "${notes}" notes.md
          else
            TAG="${GITHUB_REF_NAME}" envsubst '${TAG}' < .github/release-notes/TEMPLATE.md > notes.md
          fi
          # Both halves must be there: English first, then the Chinese section.
          grep -q '^## 中文' notes.md
          cat notes.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pre=""
          case "${GITHUB_REF_NAME}" in v0.*) pre="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --draft ${pre} \
            --title "robroz ${GITHUB_REF_NAME}" \
            --notes-file notes.md
