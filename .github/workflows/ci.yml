name: CI

# Save Actions minutes: PRs run Linux only; macOS and Windows run after
# merging to main and once a day. Pushes to PR branches don't double-run.
#
# The host and the contract live in https://github.com/PandaQuQ/robroz. The
# client's `against_host` tests build that host in-process from the git tag
# pinned in Cargo.toml, so no host image or docker is needed here.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build client
        run: cargo build --locked -p robroz-client
      - name: Test client, card, UI kit and tokens
        run: cargo test --locked -p robroz-client -p robroz-card -p robroz-ui -p robroz-tokens

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check licences, bans and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
      # Advisories are non-blocking. Remaining finding after the rusqlite
      # 0.41 upgrade: chrono is unmaintained (RUSTSEC-2026-0543).
      - name: Check advisories
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
