# cargo-deny configuration.
# New dependencies must use a licence compatible with AGPL-3.0.
# Workspace crates are unpublished (`publish = false`) and ignored here;
# they inherit `license = "AGPL-3.0-only"` via `license.workspace = true`.

[graph]
# Check dependencies for the platforms the client actually builds on.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
all-features = true

[advisories]
# cargo-deny defaults: known vulnerabilities fail the check.

[licenses]
version = 2
confidence-threshold = 0.8
# Keep the policy allow-list even when no current crate uses a licence.
unused-allowed-license = "allow"
# Include dev-dependencies: this is an application, and CI compiles them.
include-dev = true
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    # webpki-roots (via ureq): Mozilla CA bundle data. Permissive data licence, AGPL-compatible.
    "CDLA-Permissive-2.0",
    "0BSD",
    "BSL-1.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
]

# Ignore unpublished workspace crates. They are not on crates.io and
# inherit `license = "AGPL-3.0-only"` via `license.workspace = true`.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The contract (and the host, a dev-dependency for the `against_host` tests)
# come from the server repository at a pinned tag.
allow-git = ["https://github.com/PandaQuQ/robroz"]
